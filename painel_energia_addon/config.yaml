name: Painel de Energia
version: "1.3.0"
slug: painel_energia
description: Recebe as leituras do medidor IE Tecnologia (SM-3W Lite / SM-W Lite) e mostra um painel completo de energia
arch:
  - amd64
  - aarch64
  - armv7
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:lightning-bolt
panel_title: Painel de Energia
panel_admin: false
watchdog: "http://[HOST]:[PORT:8080]/api/health"
ports:
  8080/tcp: 8080
  8081/tcp: 8081
ports_description:
  8080/tcp: Porta em que o medidor envia as leituras (HTTP)
  8081/tcp: Painel direto, sem o login do Home Assistant (só com a opção ligada)
services:
  - mqtt:want
hassio_api: true
options:
  tarifa_kwh: 0.95
  unidade_contadores: kwh
  topico_mqtt: medidor/energia
  dias_leituras: 400
  segundos_offline: 180
  potencia_maxima_kw: 80
  demonstracao: desligada
  painel_direto: false
  painel_direto_permite_alterar: false
schema:
  tarifa_kwh: float(0,100)
  unidade_contadores: list(kwh|wh)
  topico_mqtt: str?
  dias_leituras: int(0,36500)
  segundos_offline: int(30,3600)
  potencia_maxima_kw: float(1,10000)
  demonstracao: list(desligada|casa|solar)
  painel_direto: bool
  painel_direto_permite_alterar: bool
  painel_direto_usuario: str?
  painel_direto_senha: password?
  mqtt_host: str?
  mqtt_port: port?
  mqtt_usuario: str?
  mqtt_senha: password?
