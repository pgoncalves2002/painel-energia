configuration:
  tarifa_kwh:
    name: Tarifa inicial (R$/kWh)
    description: Com impostos. Depois pode ser alterada no painel, em Sistema.
  unidade_contadores:
    name: Unidade dos contadores de energia do medidor
    description: Deixe kwh. Mude só se o painel avisar que os contadores parecem estar em Wh.
  topico_mqtt:
    name: Tópico MQTT do medidor
    description: Só importa se o medidor enviar por MQTT em vez de HTTP.
  dias_leituras:
    name: Dias de leituras individuais guardadas
    description: 0 guarda para sempre. Resumos de 15 minutos e energia nunca são apagados.
  segundos_offline:
    name: Segundos sem leitura para considerar o medidor parado
  potencia_maxima_kw:
    name: Maior potência possível da instalação (kW)
    description: Teto usado para descartar saltos absurdos do contador de energia.
  demonstracao:
    name: Demonstração
    description: Cria um medidor simulado com um mês de dados (casa) ou com geração solar (solar).
  painel_direto:
    name: Painel direto, sem o login do Home Assistant
    description: Abre o painel também em http://IP-DO-HOME-ASSISTANT:8081, só dentro da rede de casa.
  painel_direto_permite_alterar:
    name: Permitir alterações no painel direto
    description: Desligado, o painel direto só mostra os dados; tarifa, nomes e exclusões ficam para o painel dentro do HA.
  painel_direto_usuario:
    name: Usuário do painel direto (opcional)
    description: Com usuário e senha, o navegador pede login no painel direto. Em branco, abre sem senha.
  painel_direto_senha:
    name: Senha do painel direto (opcional)
  solar_dtu:
    name: Geração solar do DTU Hoymiles
    description: Lê a potência do solar do add-on Hoymiles DTU API e mostra o fluxo de energia (solar, rede e casa) na visão geral.
  solar_dtu_url:
    name: Endereço da API do DTU (opcional)
    description: Em branco, o painel procura o add-on Hoymiles DTU API sozinho. Ex.: http://192.168.0.102:8099
  mqtt_host:
    name: Broker MQTT (opcional)
    description: Deixe vazio para usar o add-on Mosquitto broker, encontrado automaticamente.
  mqtt_port:
    name: Porta do broker MQTT
  mqtt_usuario:
    name: Usuário do broker MQTT
  mqtt_senha:
    name: Senha do broker MQTT
network:
  8080/tcp: Porta em que o medidor envia as leituras (HTTP)
  8081/tcp: Painel direto, sem o login do Home Assistant (só com a opção ligada)
